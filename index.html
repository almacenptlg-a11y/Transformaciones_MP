<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard de Transformación | Pro</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');

        :root {
            --bg: #0f172a;
            --surface: rgba(30, 41, 59, 0.7);
            --glass: rgba(255, 255, 255, 0.03);
            --accent: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --text-dim: #94a3b8;
            --text-main: #f8fafc;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            padding: 30px 20px;
        }

        .container { max-width: 1200px; margin: auto; }

        /* HEADER CINEMÁTICO */
        .glass-header {
            background: var(--surface);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 24px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        .brand h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(to right, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .brand p { color: var(--text-dim); font-size: 13px; margin-top: 4px; text-transform: uppercase; letter-spacing: 2px; }

        .btn-group { display: flex; gap: 12px; }
        .btn { 
            padding: 12px 24px; border-radius: 14px; font-weight: 600; font-size: 14px; cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; align-items: center; gap: 10px; border: 1px solid transparent;
        }
        .btn-primary { background: var(--accent); color: white; box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4); }
        .btn-primary:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 20px 25px -5px rgba(59, 130, 246, 0.5); }
        .btn-outline { background: var(--glass); color: white; border: 1px solid var(--border); }
        .btn-outline:hover { background: rgba(255,255,255,0.1); transform: translateY(-3px); }

        /* GRID DASHBOARD */
        .dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 25px; margin-bottom: 25px; }

        .card { 
            background: var(--surface); backdrop-filter: blur(10px); border: 1px solid var(--border);
            border-radius: 24px; padding: 25px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        /* KPIs */
        .kpi-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
        .kpi-box { background: var(--glass); padding: 20px; border-radius: 18px; border: 1px solid var(--border); }
        .kpi-label { font-size: 11px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
        .kpi-value { font-size: 22px; font-weight: 800; color: #fff; }
        .kpi-value small { font-size: 14px; color: var(--text-dim); margin-left: 4px; }

        /* TABLAS MODERNAS */
        .table-container { width: 100%; overflow-x: auto; margin-top: 20px; border-radius: 16px; }
        table { width: 100%; border-collapse: collapse; color: var(--text-main); }
        th { text-align: left; padding: 16px; font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--text-dim); border-bottom: 1px solid var(--border); letter-spacing: 1px; }
        td { padding: 16px; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.03); }
        
        tr.row-group { cursor: pointer; transition: background 0.3s; }
        tr.row-group:hover { background: rgba(255,255,255,0.05); }
        .badge-pill { padding: 4px 12px; border-radius: 20px; font-weight: 700; font-size: 11px; background: var(--glass); border: 1px solid var(--border); }

        /* PROGRESS BARS */
        .bar-container { height: 6px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; margin-top: 8px; position: relative; }
        .bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #60a5fa); width: 0; transition: width 1.5s cubic-bezier(0.65, 0, 0.35, 1); }

        /* VISUALIZADOR */
        .chart-box { display: flex; flex-direction: column; height: 100%; }
        #legend-container { margin-top: 20px; display: grid; gap: 10px; }
        .legend-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: var(--glass); border-radius: 12px; font-size: 12px; }

        /* LOADER */
        #loader { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .loader-glow { width: 80px; height: 80px; border: 4px solid var(--glass); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s infinite cubic-bezier(0.5, 0, 0.5, 1); filter: drop-shadow(0 0 15px var(--accent)); }
        
        @keyframes spin { to { transform: rotate(360deg); } }

        @media print {
            body { background: white !important; color: black !important; padding: 0; }
            .action-bar, .btn-group, #loader { display: none !important; }
            .card { border: 1px solid #eee !important; box-shadow: none !important; break-inside: avoid; }
            .dashboard-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="loader-glow"></div>
        <p style="margin-top: 25px; letter-spacing: 4px; font-size: 11px; font-weight: 800; color: var(--text-dim);">SINCRONIZANDO DATOS</p>
    </div>

    <div class="container" id="main-content" style="opacity: 0;">
        
        <header class="glass-header anim-entry">
            <div class="brand">
                <p id="lblLote">LOTE: -</p>
                <h1 id="lblProductoDestino">REPORTE DE TRANSFORMACIÓN</h1>
                <p style="color: var(--accent);"><i class="fas fa-industry"></i> <span id="lblProveedor">-</span></p>
            </div>
            <div class="btn-group">
                <button class="btn btn-outline" onclick="exportarExcel()" id="btnExcel"><i class="fas fa-file-excel"></i> EXCEL PRO</button>
                <button class="btn btn-primary" onclick="descargarPDF()" id="btnExportar"><i class="fas fa-print"></i> PDF MASTER</button>
            </div>
        </header>

        <div class="dashboard-grid">
            <div class="card anim-entry">
                <p class="kpi-label">Rendimiento Operativo</p>
                <div class="kpi-row">
                    <div class="kpi-box">
                        <p class="kpi-label">Peso Ingreso</p>
                        <p class="kpi-value" id="lblPesoTrans">0.00<small>KG</small></p>
                    </div>
                    <div class="kpi-box">
                        <p class="kpi-label">Peso Final</p>
                        <p class="kpi-value" id="lblPesoTotalIngresos">0.00<small>KG</small></p>
                    </div>
                    <div class="kpi-box">
                        <p class="kpi-label">Eficiencia</p>
                        <p class="kpi-value" style="color: var(--success);" id="lblEficiencia">0.00<small>%</small></p>
                    </div>
                </div>
            </div>
            <div class="card anim-entry">
                <div class="chart-box">
                    <p class="kpi-label">Balance de Masa</p>
                    <div style="height: 180px; position: relative;">
                        <canvas id="donaChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="dashboard-grid" style="grid-template-columns: 1fr;">
            <div class="card anim-entry">
                <div class="view-controls">
                    <button class="btn btn-primary" onclick="setVista('tabla')" id="btnTabTabla">INSUMOS</button>
                    <button class="btn btn-outline" onclick="setVista('partes')" id="btnTabPartes">PARTES PRIMARIAS</button>
                </div>

                <div id="vista-tabla" class="table-container">
                    <table>
                        <thead>
                            <tr><th>Insumo</th><th>Destino</th><th>Masa Total</th><th>Participación</th></tr>
                        </thead>
                        <tbody id="tablaBody"></tbody>
                        <tfoot id="tablaFoot" class="table-footer"></tfoot>
                    </table>
                </div>

                <div id="vista-partes" class="table-container" style="display: none;">
                    <table>
                        <thead>
                            <tr><th>Parte Primaria</th><th>Peso Consolidado</th><th>% Masa</th><th>% Rendimiento</th></tr>
                        </thead>
                        <tbody id="tablaPartesBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx1yz9OGqtgWmXYEbiw6rFTfuyx-WM6r2WnW04-szj1EItjsJCRf2CYJelrilklqrfX/exec"; 
        var datosGlobales = [];
        var pesoRealGlobal = 0;
        var pesoRefGlobal = 0;
        var chartObj = null;

        const urlParams = new URLSearchParams(window.location.search);
        const idTrans = urlParams.get('id_trans');

        window.onload = () => { if(idTrans) cargarDatos(); else mostrarError("No se detectó ID"); };

        async function cargarDatos() {
            try {
                const r = await fetch(`${WEB_APP_URL}?id_trans=${idTrans}`);
                const res = await r.json();
                renderUI(res);
            } catch(e) { mostrarError("Error en API"); }
        }

        function renderUI(res) {
            gsap.to("#loader", { opacity: 0, duration: 0.8, onComplete: () => document.getElementById('loader').remove() });
            gsap.to("#main-content", { opacity: 1, y: 0, duration: 1, ease: "power4.out" });

            const cab = res.cabecera;
            document.getElementById('lblProductoDestino').innerText = cab.productoDestino.toUpperCase();
            document.getElementById('lblProveedor').innerText = cab.proveedor.toUpperCase();
            document.getElementById('lblLote').innerText = `LOTE: ${cab.lote}`;

            pesoRefGlobal = cab.pesoTotalCarga;
            pesoRealGlobal = res.pesoTotal;

            document.getElementById('lblPesoTrans').innerHTML = `${pesoRefGlobal.toFixed(2)}<small>KG</small>`;
            document.getElementById('lblPesoTotalIngresos').innerHTML = `${pesoRealGlobal.toFixed(2)}<small>KG</small>`;
            document.getElementById('lblEficiencia').innerHTML = `${((pesoRealGlobal/pesoRefGlobal)*100).toFixed(2)}<small>%</small>`;

            datosGlobales = res.datos;
            dibujarTablas();
        }

        function dibujarTablas() {
            const body = document.getElementById('tablaBody');
            body.innerHTML = '';
            
            // Agrupación de Insumos
            const matG = {};
            datosGlobales.forEach(d => {
                matG[d.material] = matG[d.material] || { p: 0, parts: new Set() };
                matG[d.material].p += d.peso;
                matG[d.material].parts.add(d.parte);
            });

            Object.keys(matG).forEach((k, i) => {
                const row = document.createElement('tr');
                const pct = (matG[k].p / pesoRealGlobal) * 100;
                row.innerHTML = `
                    <td><b>${k}</b></td>
                    <td><span class="badge-pill">${Array.from(matG[k].parts).join(', ')}</span></td>
                    <td>${matG[k].p.toFixed(2)} Kg</td>
                    <td>
                        <div class="progress-wrapper">
                            <div class="pct-text" style="font-weight:800; font-size:12px; margin-bottom:4px;">${pct.toFixed(2)}%</div>
                            <div class="bar-container"><div class="bar-fill" style="width: ${pct}%"></div></div>
                        </div>
                    </td>
                `;
                body.appendChild(row);
            });

            // Agrupación de Partes Primarias
            const partBody = document.getElementById('tablaPartesBody');
            partBody.innerHTML = '';
            const pG = {};
            datosGlobales.forEach(d => {
                pG[d.parte] = (pG[d.parte] || 0) + d.peso;
            });

            const labels = []; const values = [];
            Object.keys(pG).forEach(k => {
                labels.push(k); values.push(pG[k]);
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><b>${k}</b></td>
                    <td>${pG[k].toFixed(2)} Kg</td>
                    <td>${((pG[k]/pesoRealGlobal)*100).toFixed(2)}%</td>
                    <td><span class="badge-pill" style="color:var(--success)">${((pG[k]/pesoRefGlobal)*100).toFixed(2)}%</span></td>
                `;
                partBody.appendChild(row);
            });

            initChart(labels, values);
        }

        function initChart(l, v) {
            const ctx = document.getElementById('donaChart').getContext('2d');
            chartObj = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: l, datasets: [{ data: v, backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'], borderWeight: 0 }] },
                options: { cutout: '80%', plugins: { legend: { display: false } }, maintainAspectRatio: false }
            });
        }

        async function exportarExcel() {
            const wb = new ExcelJS.Workbook();
            const ws = wb.addWorksheet('Reporte Master');
            const nom = `TRANSFORMACION_${document.getElementById('lblProductoDestino').innerText}_${document.getElementById('lblLote').innerText}`;

            // ESTILOS PRO
            const titleSt = { font: { bold: true, color: { argb: 'FFFFFFFF' }, size: 14 }, fill: { type: 'pattern', pattern:'solid', fgColor:{argb:'FF0F172A'} } };
            const subSt = { font: { bold: true, color: { argb: 'FFFFFFFF' } }, fill: { type: 'pattern', pattern:'solid', fgColor:{argb:'FF3B82F6'} } };

            // TABLA 1: RESUMEN EJECUTIVO
            ws.addRow(['1. RESUMEN EJECUTIVO']).font = {bold:true, size:12};
            ws.addRow(['PRODUCTO', document.getElementById('lblProductoDestino').innerText]);
            ws.addRow(['PROVEEDOR', document.getElementById('lblProveedor').innerText]);
            ws.addRow(['LOTE', document.getElementById('lblLote').innerText]);
            ws.addRow(['PESO INICIAL', parseFloat(document.getElementById('lblPesoTrans').innerText)]);
            ws.addRow(['PESO FINAL', parseFloat(document.getElementById('lblPesoTotalIngresos').innerText)]);
            ws.addRow(['RENDIMIENTO', document.getElementById('lblEficiencia').innerText]);
            ws.addRow([]);

            // TABLA 2: RENDIMIENTO ESTRUCTURAL (PARTES)
            ws.addRow(['2. RENDIMIENTO POR PARTES PRIMARIAS']).font = {bold:true, size:12};
            const h2 = ws.addRow(['PARTE PRIMARIA', 'PESO KG', '% MASA', '% RENDIMIENTO']);
            h2.eachCell(c => c.style = subSt);
            document.querySelectorAll('#tablaPartesBody tr').forEach(r => {
                const c = r.querySelectorAll('td');
                ws.addRow([c[0].innerText, parseFloat(c[1].innerText), c[2].innerText, c[3].innerText]);
            });
            ws.addRow([]);

            // TABLA 3: DESGLOSE OPERATIVO (INSUMOS)
            ws.addRow(['3. DESGLOSE OPERATIVO DE INSUMOS']).font = {bold:true, size:12};
            const h3 = ws.addRow(['MATERIAL', 'DESTINOS', 'MASA TOTAL', '% PARTICIPACIÓN']);
            h3.eachCell(c => c.style = subSt);
            document.querySelectorAll('#tablaBody tr').forEach(r => {
                const c = r.querySelectorAll('td');
                ws.addRow([c[0].innerText, c[1].innerText, parseFloat(c[2].innerText), c[3].querySelector('.pct-text').innerText]);
            });

            ws.columns.forEach(c => c.width = 25);
            const b = await wb.xlsx.writeBuffer();
            saveAs(new Blob([b]), `${nom}.xlsx`);
        }

        function descargarPDF() { window.print(); }
        function setVista(v) {
            document.getElementById('vista-tabla').style.display = v==='tabla' ? 'block' : 'none';
            document.getElementById('vista-partes').style.display = v==='partes' ? 'block' : 'none';
        }
        function mostrarError(m) { document.getElementById('loader').innerHTML = `<p style="color:var(--danger)">${m}</p>`; }
    </script>
</body>
</html>
