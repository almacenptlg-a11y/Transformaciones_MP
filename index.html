<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cargando Reporte...</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <style>
      /* (Mismo CSS profesional anterior con @media print y acordeones) */
      :root { --primary: #1a73e8; --secondary: #5f6368; --success: #1e8e3e; --danger: #d93025; --warning: #f29900; --info: #0288d1; --background: #f0f2f5; --surface: #ffffff; --border: #e0e0e0; --text-main: #202124; }
      * { box-sizing: border-box; }
      body { font-family: 'Roboto', 'Segoe UI', sans-serif; padding: 20px; background-color: var(--background); color: var(--text-main); margin: 0; }
      .container { max-width: 1000px; margin: auto; }
      .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
      .action-bar { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 20px; }
      .view-controls { display: flex; gap: 10px; margin-bottom: 20px; padding: 15px 25px; background: #f8fafd; border-radius: 8px; border: 1px solid #e1eaf7; align-items: center;}
      .view-controls-title { flex-grow: 1; margin: 0; font-size: 16px; color: var(--secondary); font-weight: bold;}
      .btn { padding: 10px 18px; border: none; border-radius: 6px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 14px; transition: all 0.2s ease; }
      .btn-primary { background: var(--primary); color: white; }
      .btn-outline { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); }
      .card { background: var(--surface); padding: 25px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
      .header-card { border-left: 6px solid var(--primary); }
      .summary-matrix { display: grid; grid-template-columns: 1fr 1fr; gap: 15px 40px; background: #f8fafd; padding: 20px 25px; border-radius: 8px; border: 1px solid #e1eaf7; margin-bottom: 25px; }
      .summary-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #d2dceb; padding-bottom: 6px; }
      .summary-label { font-size: 13px; color: var(--secondary); font-weight: 600; text-transform: uppercase; }
      .summary-value { font-size: 15px; font-weight: 700; color: var(--text-main); }
      .text-primary { color: var(--primary) !important; } .text-success { color: var(--success) !important; } .text-danger { color: var(--danger) !important; }
      .table-responsive { width: 100%; border: 1px solid var(--border); border-radius: 8px; background: white; overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; background: white; min-width: 600px; }
      th { position: sticky; top: 0; background-color: #f8f9fa; color: var(--secondary); font-size: 12px; text-transform: uppercase; padding: 14px 20px; text-align: left; border-bottom: 2px solid var(--border); }
      th.sortable { cursor: pointer; user-select: none; }
      td { padding: 14px 20px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
      .table-footer td { background-color: #f4f6f9 !important; border-top: 2px solid #cbd0d6; font-weight: bold; }
      .row-group-header { background-color: #f4f6f9 !important; border-top: 2px solid #cbd0d6; cursor: pointer; }
      .row-sub-item td { padding-left: 45px !important; color: var(--secondary); font-size: 13px; border-bottom: 1px dashed var(--border);}
      .progress-wrapper { display: flex; align-items: center; gap: 12px; }
      .progress-bar { flex-grow: 1; background: #e8eaed; height: 6px; border-radius: 3px; overflow: hidden; }
      .progress-fill { background: var(--primary); height: 100%; width: 0%; transition: width 1.2s ease; }
      .pct-text { width: 60px; text-align: right; font-weight: 600; font-size: 13px; color: var(--secondary); }
      .chart-layout { display: flex; flex-direction: row; gap: 20px; align-items: center; }
      .chart-canvas-wrapper { flex: 1; height: 350px; position: relative; }
      .chart-legend-wrapper { flex: 1; max-height: 350px; overflow-y: auto; padding-right: 15px; }
      .loader { text-align: center; padding: 60px 20px; color: var(--secondary); }
      .kpi-badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; background: #e1f5fe; color: var(--info); border: 1px solid rgba(0,0,0,0.05);}

      @media print {
        .action-bar, .view-controls { display: none !important; }
        #vista-tabla, #vista-partes, #vista-grafico { display: block !important; }
        #vista-grafico { display: flex !important; margin-top: 30px; }
        .row-sub-item { display: table-row !important; }
        table { page-break-inside: auto; }
        tr { page-break-inside: avoid; }
        * { -webkit-print-color-adjust: exact !important; opacity: 1 !important; visibility: visible !important; }
      }
    </style>
  </head>
  <body>
    <div class="container" id="reporte-contenedor">
      
      <div id="loader" class="loader fade-in">
        <i class="fas fa-circle-notch fa-spin fa-3x" style="color: var(--primary);"></i>
        <p style="margin-top: 20px; font-weight: 500;">Conectando con la API de Almacén...</p>
      </div>

      <div id="dashboard" style="display: none;" class="fade-in">
        <div class="action-bar" id="botones-accion">
          <button class="btn btn-outline" style="color: #1e8e3e; border-color: #1e8e3e;" onclick="exportarExcel()" id="btnExcel"><i class="fas fa-file-excel"></i> Excel</button>
          <button class="btn btn-primary" onclick="descargarPDF()" id="btnExportar"><i class="fas fa-file-pdf"></i> Reporte Master</button>
        </div>

        <div class="card header-card">
          <h2>
            <span><i class="fas fa-cube"></i> Producto: <span id="lblProductoDestino">-</span></span>
            <span style="font-size: 14px; color: var(--secondary); font-weight: normal;"><i class="fas fa-truck"></i> Prov: <span id="lblProveedor">-</span></span>
          </h2>
          <div class="summary-matrix">
            <div style="display: flex; flex-direction: column; gap: 12px;">
              <div class="summary-row"><span class="summary-label">Ingreso:</span><span class="summary-value text-primary"><span id="lblPesoTrans">0.00</span> Kg</span></div>
              <div class="summary-row"><span class="summary-label">Resultado:</span><span class="summary-value"><span id="lblPesoTotalIngresos">0.00</span> Kg</span></div>
              <div class="summary-row"><span class="summary-label">Diferencia:</span><span class="summary-value text-danger"><span id="lblPesoFaltante">0.00</span> Kg</span></div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 12px;">
              <div class="summary-row"><span class="summary-label">Lote:</span><span class="summary-value" id="lblLote">-</span></div>
              <div class="summary-row"><span class="summary-label">% Rendimiento:</span><span class="summary-value text-success"><span id="lblEficiencia">0.00</span> %</span></div>
              <div class="summary-row"><span class="summary-label">% Merma:</span><span class="summary-value text-danger"><span id="lblMerma">0.00</span> %</span></div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="view-controls">
             <p class="view-controls-title">Analítica de Transformación</p>
             <button class="btn btn-primary" onclick="setVista('tabla')" id="btnTabTabla">Resumen Insumos</button>
             <button class="btn btn-outline" onclick="setVista('partes')" id="btnTabPartes">Desglose Partes</button>
             <button class="btn btn-outline" onclick="setVista('grafico')" id="btnTabGrafico">Visual</button>
          </div>

          <div id="vista-tabla" class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th id="th-material" class="sortable" onclick="ordenarDetalle('material')" data-label="Material">Material</th>
                  <th id="th-parte" class="sortable" onclick="ordenarDetalle('parte')" data-label="Partes">Partes</th>
                  <th id="th-peso" class="sortable" onclick="ordenarDetalle('peso')" data-label="Peso">Peso (Kg)</th>
                  <th id="th-pct" class="sortable" onclick="ordenarDetalle('pct')" data-label="% Part.">% Part.</th>
                </tr>
              </thead>
              <tbody id="tablaBody"></tbody>
              <tfoot id="tablaFoot" class="table-footer"></tfoot>
            </table>
          </div>

          <div id="vista-partes" class="table-responsive" style="display: none;">
            <table>
              <thead>
                <tr><th>Parte</th><th>Peso (Kg)</th><th>% Part.</th><th>% Rend.</th></tr>
              </thead>
              <tbody id="tablaPartesBody"></tbody>
              <tfoot id="tablaPartesFoot" class="table-footer"></tfoot>
            </table>
          </div>

          <div id="vista-grafico" class="chart-layout" style="display: none;">
            <div class="chart-canvas-wrapper"><canvas id="donaChart"></canvas></div>
            <div class="chart-legend-wrapper" id="custom-legend"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // ==========================================
      // CONFIGURACIÓN DE MIGRACIÓN
      // ==========================================
      // PEGA AQUÍ LA URL DE TU SCRIPT PUBLICADO (Apps Script Web App URL)
      const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx1yz9OGqtgWmXYEbiw6rFTfuyx-WM6r2WnW04-szj1EItjsJCRf2CYJelrilklqrfX/exec";

      var datosGlobales = [];
      var pesoRealGlobal = 0;
      var pesoRefGlobal = 0;
      var sortConfig = { col: 'peso', asc: false };
      var datosChartObj = null;

      // 1. OBTENER ID DE LA URL (ej. index.html?id_trans=59999896)
      const urlParams = new URLSearchParams(window.location.search);
      const idTrans = urlParams.get('id_trans');

      // 2. INICIO DE CARGA
      window.onload = function() {
        if (!idTrans) {
            document.getElementById('loader').innerHTML = `<div class="kpi-badge text-danger">Error: No se detectó ID de transformación en la URL.</div>`;
            return;
        }
        cargarDatos();
      };

      async function cargarDatos() {
        try {
            // El modo 'cors' es vital para GitHub -> Google
            const response = await fetch(`${WEB_APP_URL}?id_trans=${idTrans}`);
            const res = await response.json();
            procesarRespuesta(res);
        } catch (error) {
            console.error("Error API:", error);
            document.getElementById('loader').innerHTML = `<div class="kpi-badge text-danger">Error de conexión con la API de Google.</div>`;
        }
      }

      // ==========================================
      // LÓGICA DE PROCESAMIENTO (REUTILIZADA)
      // ==========================================
      const formatStrict = (v, d = 2) => {
        const n = parseFloat(v) || 0;
        const s = n.toFixed(d + 2); 
        const p = s.split('.');
        return p[0] + '.' + p[1].substring(0, d);
      };

      function escapeHtml(t) { return String(t || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#039;"}[m])); }

      function procesarRespuesta(res) {
        document.getElementById('loader').style.display = 'none';
        if(!res || !res.exito) {
           document.getElementById('dashboard').style.display = 'block';
           document.getElementById('dashboard').innerHTML = `<div class="kpi-badge text-danger">${res ? res.mensaje : 'ID no encontrado'}</div>`;
           return;
        }

        document.getElementById('dashboard').style.display = 'block';
        const cab = res.cabecera;
        document.getElementById('lblProductoDestino').innerText = cab.productoDestino;
        document.getElementById('lblProveedor').innerText = cab.proveedor;
        document.getElementById('lblLote').innerText = cab.lote;
        
        pesoRefGlobal = parseFloat(formatStrict(cab.pesoTotalCarga, 2));
        pesoRealGlobal = parseFloat(formatStrict(res.pesoTotal, 2));

        const merma = Math.max(0, pesoRefGlobal - pesoRealGlobal);
        document.getElementById('lblPesoTrans').innerText = formatStrict(pesoRefGlobal, 2);
        document.getElementById('lblPesoTotalIngresos').innerText = formatStrict(pesoRealGlobal, 2);
        document.getElementById('lblPesoFaltante').innerText = formatStrict(merma, 2);
        document.getElementById('lblEficiencia').innerText = formatStrict(pesoRefGlobal > 0 ? (pesoRealGlobal / pesoRefGlobal) * 100 : 0, 2);
        document.getElementById('lblMerma').innerText = formatStrict(pesoRefGlobal > 0 ? (merma / pesoRefGlobal) * 100 : 0, 2);

        datosGlobales = res.datos;
        renderizarTablas();
      }

      function renderizarTablas() {
        const tbodyDetalle = document.getElementById('tablaBody');
        const tfootDetalle = document.getElementById('tablaFoot');
        const tbodyPartes = document.getElementById('tablaPartesBody');
        const tfootPartes = document.getElementById('tablaPartesFoot');
        
        tbodyDetalle.innerHTML = ''; tbodyPartes.innerHTML = '';

        const matGroup = {}; const partGroup = {};
        datosGlobales.forEach(it => {
            const p = parseFloat(it.peso) || 0;
            // Agrupar Material
            matGroup[it.material] = matGroup[it.material] || { p: 0, parts: new Set() };
            matGroup[it.material].p += p; matGroup[it.material].parts.add(it.parte);
            // Agrupar Parte
            partGroup[it.parte] = partGroup[it.parte] || { p: 0, items: [] };
            partGroup[it.parte].p += p; partGroup[it.parte].items.push({ m: it.material, p: p });
        });

        // Render Detalle
        let listMat = Object.keys(matGroup).map(k => ({ material: k, parte: Array.from(matGroup[k].parts).join(', '), peso: matGroup[k].p }));
        listMat.sort((a, b) => {
            let vA = a[sortConfig.col], vB = b[sortConfig.col];
            if (typeof vA === 'string') { vA = vA.toUpperCase(); vB = vB.toUpperCase(); }
            return sortConfig.asc ? (vA > vB ? 1 : -1) : (vA < vB ? 1 : -1);
        });

        listMat.forEach((it, idx) => {
            const pct = pesoRealGlobal > 0 ? (it.peso / pesoRealGlobal) * 100 : 0;
            const tr = document.createElement('tr');
            tr.innerHTML = `<td><b>${escapeHtml(it.material)}</b></td><td>${escapeHtml(it.parte)}</td><td>${formatStrict(it.peso, 2)}</td><td><div class="progress-wrapper"><div class="progress-bar"><div class="progress-fill" id="bar-${idx}" style="width:0%"></div></div><div class="pct-text">${formatStrict(pct, 2)}%</div></div></td>`;
            tbodyDetalle.appendChild(tr);
            setTimeout(() => document.getElementById(`bar-${idx}`).style.width = formatStrict(pct, 2) + '%', 100);
        });
        tfootDetalle.innerHTML = `<tr><td colspan="2">TOTAL INSUMOS</td><td>${formatStrict(pesoRealGlobal, 2)}</td><td>100.00%</td></tr>`;

        // Render Partes
        const listPart = Object.keys(partGroup).map(k => ({ parte: k, peso: partGroup[k].p, items: partGroup[k].items })).sort((a, b) => b.peso - a.peso);
        const labels = []; const values = [];
        listPart.forEach((g, idx) => {
            labels.push(g.parte); values.push(g.peso);
            const tr = document.createElement('tr'); tr.className = 'row-group-header';
            tr.onclick = () => { const rows = document.querySelectorAll(`.sub-${idx}`); const icon = document.getElementById(`icon-${idx}`); const isCol = icon.classList.contains('fa-chevron-right'); icon.classList.toggle('fa-chevron-right'); icon.classList.toggle('fa-chevron-down'); rows.forEach(r => r.style.display = isCol ? 'table-row' : 'none'); };
            tr.innerHTML = `<td><i class="fas fa-chevron-right" id="icon-${idx}"></i> ${escapeHtml(g.parte)}</td><td>${formatStrict(g.peso, 2)}</td><td>${formatStrict((g.peso/pesoRealGlobal)*100, 2)}%</td><td><span class="kpi-badge">${formatStrict((g.peso/pesoRefGlobal)*100, 2)}%</span></td>`;
            tbodyPartes.appendChild(tr);
            g.items.forEach(it => {
                const sr = document.createElement('tr'); sr.className = `row-sub-item sub-${idx}`; sr.style.display = 'none';
                sr.innerHTML = `<td>└ ${escapeHtml(it.m)}</td><td>${formatStrict(it.p, 2)}</td><td>${formatStrict((it.p/pesoRealGlobal)*100, 2)}%</td><td></td>`;
                tbodyPartes.appendChild(sr);
            });
        });
        tfootPartes.innerHTML = `<tr><td>TOTAL ESTRUCTURAL</td><td>${formatStrict(pesoRealGlobal, 2)}</td><td>100.00%</td><td>${formatStrict((pesoRealGlobal/pesoRefGlobal)*100, 2)}%</td></tr>`;
        generarGrafico(labels, values);
      }

      function generarGrafico(l, v) {
        if(datosChartObj) datosChartObj.destroy();
        datosChartObj = new Chart(document.getElementById('donaChart'), { type: 'doughnut', data: { labels: l, datasets: [{ data: v, backgroundColor: ['#1a73e8', '#34a853', '#fbbc04', '#ea4335', '#8e24aa', '#00bcd4'] }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } } });
        document.getElementById('custom-legend').innerHTML = l.map((label, i) => `<div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px;"><span>${label}</span><b>${formatStrict(v[i], 2)} Kg</b></div>`).join('');
      }

      function setVista(v) { ['tabla', 'partes', 'grafico'].forEach(x => { document.getElementById('vista-'+x).style.display = 'none'; document.getElementById('btnTab'+x.charAt(0).toUpperCase()+x.slice(1)).className = 'btn btn-outline'; }); document.getElementById('vista-'+v).style.display = v==='grafico'?'flex':'block'; document.getElementById('btnTab'+v.charAt(0).toUpperCase()+v.slice(1)).className = 'btn btn-primary'; if(v==='grafico') datosChartObj.resize(); }
      
      function ordenarDetalle(c) { if(sortConfig.col===c) sortConfig.asc = !sortConfig.asc; else { sortConfig.col=c; sortConfig.asc=false; } renderizarTablas(); }

      // ==========================================
      // EXPORTACIONES (CON NOMENCLATURA)
      // ==========================================
      async function exportarExcel() {
        const safe = (id) => document.getElementById(id).innerText.toUpperCase();
        const nom = `TRANSFORMACION_${safe('lblProductoDestino')}_${safe('lblLote')}_${safe('lblProveedor')}`;
        const wb = new ExcelJS.Workbook(); const ws = wb.addWorksheet('Reporte');
        ws.addRow([`REPORTE: ${nom}`]);
        ws.addRow(["PESO INGRESO", parseFloat(document.getElementById('lblPesoTrans').innerText)]);
        ws.addRow(["PESO RESULTADO", parseFloat(document.getElementById('lblPesoTotalIngresos').innerText)]);
        ws.addRow([]);
        ws.addRow(["MATERIAL", "PARTE", "PESO (KG)", "% PART"]);
        document.querySelectorAll('#tablaBody tr').forEach(r => { const c = r.querySelectorAll('td'); if(c.length >= 4) ws.addRow([c[0].innerText, c[1].innerText, parseFloat(c[2].innerText), c[3].querySelector('.pct-text').innerText]); });
        const buf = await wb.xlsx.writeBuffer(); saveAs(new Blob([buf]), `${nom}.xlsx`);
      }

      function descargarPDF() {
        const safe = (id) => document.getElementById(id).innerText.toUpperCase();
        const nom = `TRANSFORMACION_${safe('lblProductoDestino')}_${safe('lblLote')}_${safe('lblProveedor')}`;
        const orig = document.title; document.title = nom;
        document.querySelectorAll('.row-sub-item').forEach(r => r.style.display = 'table-row');
        document.getElementById('vista-tabla').style.display = 'block';
        document.getElementById('vista-partes').style.display = 'block';
        document.getElementById('vista-grafico').style.display = 'flex';
        datosChartObj.resize();
        setTimeout(() => { window.print(); document.title = orig; location.reload(); }, 500);
      }
    </script>
  </body>
</html>
